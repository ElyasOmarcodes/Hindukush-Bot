name: Hindukush-Bot CI & Run

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test bot
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: pytest -v

  run-bot:
    name: Run bot
    needs: test
    runs-on: ubuntu-latest
    # GitHub Actions caps a single job at 6 hours (360 min). We run the bot
    # for as long as the platform allows so it stays alive during the session.
    timeout-minutes: 350
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check that the token secret is configured
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "::error::TELEGRAM_BOT_TOKEN secret is not set."
            echo "Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "TELEGRAM_BOT_TOKEN secret is present."

      - name: Run Hindukush-Bot (polling)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: |
          echo "Starting bot. It will run until the job timeout is reached."
          # Run the bot for up to ~5h50m. `timeout` returns 124 when it stops
          # the process on time, which we treat as a successful, clean run.
          set +e
          timeout 350m python -u bot.py
          code=$?
          echo "Bot process exited with code ${code}."
          if [ "${code}" -eq 124 ]; then
            echo "Bot ran for the full allotted time and was stopped by timeout."
            exit 0
          fi
          exit "${code}"
